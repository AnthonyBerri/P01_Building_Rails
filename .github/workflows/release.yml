name: CD - Release & Deploy (itch.io)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ITCH_USER: "antfelixberri"
  ITCH_GAME: "building-rails"

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Exportar usando o TIC-80 PRO Local (alone=1)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Cria as pastas de saída
          New-Item -ItemType Directory -Path "build" -Force | Out-Null

          # Localiza o seu executável PRO que foi commitado na pasta tools
          $ticExe = "tools/tic80.exe"
          if (!(Test-Path $ticExe)) {
            throw "Erro: O seu tic80.exe PRO customizado nao foi encontrado na pasta tools!"
          }
          Write-Host "Usando o TIC-80 PRO localizado em: $ticExe"

          # Copia o cartucho original mantendo a nomenclatura da tag
          Copy-Item "building_rails.tic" "build/BuildingRails-${{ github.ref_name }}.tic" -Force

          # ---------------------------------------------------------------------------------
          # COMANDO DE EXPORTAÇÃO PRO - Removendo console e editores via código nativo
          # ---------------------------------------------------------------------------------
          Write-Host "Executando exportacao limpa com alone=1..."
          & $ticExe --cli --fs="." --cmd="load building_rails.tic & export html build/BuildingRails-${{ github.ref_name }}-Web.zip alone=1 & export win build/BuildingRails.exe alone=1 & exit"

          Write-Host "Conteudo da pasta build gerada:"
          Get-ChildItem "build" | Select-Object Name, Length

          # Valida se os pacotes foram criados
          if (!(Test-Path "build/BuildingRails-${{ github.ref_name }}-Web.zip")) {
            throw "Erro: O ZIP HTML5 standalone nao foi gerado pelo seu TIC-80 PRO!"
          }

          if (Test-Path "build/BuildingRails.exe") {
            Compress-Archive -Path "build/BuildingRails.exe" -DestinationPath "build/BuildingRails-${{ github.ref_name }}-Win64.zip" -Force
          } else {
            throw "Erro: O executavel Windows standalone nao foi gerado pelo seu TIC-80 PRO!"
          }

      - name: 3. Publicar no GitHub Releases (com Changelog Automático)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/BuildingRails-${{ github.ref_name }}-Web.zip
            build/BuildingRails-${{ github.ref_name }}-Win64.zip
            build/BuildingRails-${{ github.ref_name }}.tic

      - name: 4. Baixar itch.io Butler CLI e Fazer Deploy Nativamente
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Path "butler_bin" -Force | Out-Null

          Write-Host "Baixando Butler da URL direta oficial..."
          # URL direta oficial do Butler para Windows 64-bit
          curl.exe -fsSL "https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default" -o "butler.zip"
          
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "butler.zip")) { 
            throw "Erro crítico: Nao foi possivel baixar o Butler CLI do servidor do itch.io. Verifique a conexao." 
          }

          Write-Host "Extraindo Butler..."
          Expand-Archive -Path "butler.zip" -DestinationPath "butler_bin" -Force

          $butler = Get-ChildItem -Path "butler_bin" -Recurse -Filter "butler.exe" | Select-Object -First 1
          if (-not $butler) { throw "butler.exe nao encontrado apos extrair" }

          $target = "$env:ITCH_USER/$env:ITCH_GAME"
          $version = "${{ github.ref_name }}"

          Write-Host "Enviando builds protegidas nativamente com alone=1 para o itch.io ($target)..."

          & $butler.FullName push "build/BuildingRails-$version-Web.zip" "${target}:html5" --userversion "$version"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar o HTML5 para o itch.io" }

          & $butler.FullName push "build/BuildingRails-$version-Win64.zip" "${target}:windows" --userversion "$version"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar o build Windows para o itch.io" }

          & $butler.FullName push "build/BuildingRails-$version.tic" "${target}:tic80" --userversion "$version"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar o .tic para o itch.io" }
