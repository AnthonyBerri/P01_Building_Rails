name: CD - Release & Deploy (itch.io)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  ITCH_USER: "antfelixberri"
  ITCH_GAME: "building-rails"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Instalar TIC-80 CLI (x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libgl1 libglu1-mesa xvfb jq
          mkdir -p tic80_bin
          TIC_URL=$(curl -s https://api.github.com/repos/nesbox/TIC-80/releases | jq -r '[.[].assets[] | select((.name | test("linux")) and (.name | test("arm|rpi|android") | not) and (.name | test("\\.tar\\.gz$|\\.zip$")))][0].browser_download_url')
          echo "Baixando TIC-80 x64 de: $TIC_URL"
          wget -q "$TIC_URL" -O tic80_pkg
          if [[ "$TIC_URL" == *.tar.gz ]]; then
            tar -xzf tic80_pkg -C tic80_bin
          else
            unzip -q tic80_pkg -d tic80_bin
          fi
          TIC_BIN=$(find tic80_bin -name "tic80" -type f | head -n 1)
          chmod +x "$TIC_BIN"
          ln -sf "$(realpath "$TIC_BIN")" ./tic80_exec

      - name: 3. Exportar building_rails.tic (Web HTML5, Windows e .tic)
        run: |
          mkdir -p build
          cp building_rails.tic build/BuildingRails-${{ github.ref_name }}.tic
          xvfb-run -a ./tic80_exec --cli --fs=. \
            --cmd="load building_rails.tic & export html build/BuildingRails-${{ github.ref_name }}-Web.zip & export win build/BuildingRails-${{ github.ref_name }}-Win64.zip & exit"

      - name: 4. Publicar no GitHub Releases (com Changelog Automático)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/BuildingRails-${{ github.ref_name }}-Web.zip
            build/BuildingRails-${{ github.ref_name }}-Win64.zip
            build/BuildingRails-${{ github.ref_name }}.tic

      - name: 5. Instalar itch.io Butler CLI
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler_bin
          chmod +x butler_bin/butler

      - name: 6. Deploy Automático para o itch.io (Butler)
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          ./butler_bin/butler push build/BuildingRails-${{ github.ref_name }}-Web.zip ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:html5 --userversion ${{ github.ref_name }}
          ./butler_bin/butler push build/BuildingRails-${{ github.ref_name }}-Win64.zip ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:windows --userversion ${{ github.ref_name }}
          ./butler_bin/butler push build/BuildingRails-${{ github.ref_name }}.tic ${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:tic80 --userversion ${{ github.ref_name }}