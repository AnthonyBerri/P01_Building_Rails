name: CD - Release & Deploy (itch.io)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  ITCH_USER: "antfelixberri"
  ITCH_GAME: "building-rails"

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Baixar TIC-80 CLI e Exportar (Web HTML5, Windows e .tic)
        shell: pwsh
        run: |
          if (!(Test-Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }
          if (!(Test-Path "tic80_bin")) { New-Item -ItemType Directory -Path "tic80_bin" | Out-Null }

          Write-Host "Baixando TIC-80..."
          curl.exe -sL "https://github.com/nesbox/TIC-80/releases/download/v1.3.1/tic80-v1.3.1-win.zip" -o "tic80.zip"
          
          Write-Host "Extraindo TIC-80..."
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory("tic80.zip", "tic80_bin")

          Copy-Item "building_rails.tic" "build/BuildingRails-${{ github.ref_name }}.tic" -Force

          Write-Host "Exportando builds..."
          & "tic80_bin/tic80.exe" --cli --fs="." --cmd="load building_rails.tic & export html build/BuildingRails-${{ github.ref_name }}-Web.zip & export win build/BuildingRails.exe & exit"

          if (Test-Path "build/BuildingRails.exe") {
              Compress-Archive -Path "build/BuildingRails.exe" -DestinationPath "build/BuildingRails-${{ github.ref_name }}-Win64.zip" -Force
          } else {
              throw "Erro: O executavel Windows nao foi gerado pelo TIC-80!"
          }

      - name: 3. Publicar no GitHub Releases (com Changelog Automático)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/BuildingRails-${{ github.ref_name }}-Web.zip
            build/BuildingRails-${{ github.ref_name }}-Win64.zip
            build/BuildingRails-${{ github.ref_name }}.tic

      - name: 4. Baixar itch.io Butler CLI e Fazer Deploy
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
        run: |
          if (!(Test-Path "butler_bin")) { New-Item -ItemType Directory -Path "butler_bin" | Out-Null }
          
          Write-Host "Baixando Butler..."
          curl.exe -sL "https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default" -o "butler.zip"
          
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory("butler.zip", "butler_bin")

          Write-Host "Enviando para o itch.io..."
          & "butler_bin/butler.exe" push "build/BuildingRails-${{ github.ref_name }}-Web.zip" "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:html5" --userversion "${{ github.ref_name }}"
          & "butler_bin/butler.exe" push "build/BuildingRails-${{ github.ref_name }}-Win64.zip" "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:windows" --userversion "${{ github.ref_name }}"
          & "butler_bin/butler.exe" push "build/BuildingRails-${{ github.ref_name }}.tic" "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:tic80" --userversion "${{ github.ref_name }}"