name: CI - Validação (Luacheck & TIC-80)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Instalar Luacheck e TIC-80 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check lua5.3
          test -f building_rails.tic

      - name: 3. Validar Sintaxe Lua (main.lua)
        run: |
          luac5.3 -p main.lua
          luacheck main.lua --config .luacheckrc

      - name: 4. Validar Integridade e Limite de 64KB do Cartucho (.tic)
        run: |
          SIZE=$(stat -c%s "building_rails.tic")
          echo "Tamanho do cartucho: $SIZE bytes"
          if [ "$SIZE" -le 0 ] || [ "$SIZE" -gt 65536 ]; then
            echo "Erro: Cartucho invalido ou acima de 64KB!"
            exit 1
          fi