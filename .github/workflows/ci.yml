name: CI - Validação (Luacheck & TIC-80)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Instalar Luacheck e TIC-80 CLI (v1.3.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 luarocks unzip libgl1 libglu1-mesa xvfb
          sudo luarocks install luacheck
          wget -q https://github.com/nesbox/TIC-80/releases/download/v1.3.1/tic80-v1.3.1-linux.zip
          unzip -q tic80-v1.3.1-linux.zip -d tic80_bin
          chmod +x tic80_bin/tic80

      - name: 3. Validar Sintaxe Lua (main.lua)
        run: luacheck main.lua --config .luacheckrc

      - name: 4. Validar Integridade do Cartucho (building_rails.tic)
        run: |
          mkdir -p build_test
          xvfb-run -a ./tic80_bin/tic80 --cli --fs=. \
            --cmd="load building_rails.tic & export html build_test/test_web.zip & exit"
          test -f build_test/test_web.zip