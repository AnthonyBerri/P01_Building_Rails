name: CI - Validação (Luacheck & TIC-80)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Instalar Luacheck e TIC-80 CLI (x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check unzip libgl1 libglu1-mesa xvfb jq
          mkdir -p tic80_bin
          TIC_URL=$(curl -s https://api.github.com/repos/nesbox/TIC-80/releases | jq -r '[.[].assets[] | select((.name | test("linux")) and (.name | test("arm|rpi|android") | not) and (.name | test("\\.tar\\.gz$|\\.zip$")))][0].browser_download_url')
          echo "Baixando TIC-80 x64 de: $TIC_URL"
          wget -q "$TIC_URL" -O tic80_pkg
          if [[ "$TIC_URL" == *.tar.gz ]]; then
            tar -xzf tic80_pkg -C tic80_bin
          else
            unzip -q tic80_pkg -d tic80_bin
          fi
          TIC_BIN=$(find tic80_bin -name "tic80" -type f | head -n 1)
          chmod +x "$TIC_BIN"
          ln -sf "$(realpath "$TIC_BIN")" ./tic80_exec

      - name: 3. Validar Sintaxe Lua (main.lua)
        run: luacheck main.lua --config .luacheckrc

      - name: 4. Validar Integridade do Cartucho (building_rails.tic)
        run: |
          mkdir -p build_test
          xvfb-run -a ./tic80_exec --cli --fs=. \
            --cmd="load building_rails.tic & export html build_test/test_web.zip & exit"
          test -f build_test/test_web.zip